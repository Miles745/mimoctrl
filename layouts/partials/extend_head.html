{{- /* Project override: load KaTeX when math is enabled */ -}}
{{- if or .Params.math site.Params.math -}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof renderMathInElement !== 'function') return;
    renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  });
</script>
{{- end -}}

{{- /* Optional: prefer a CJK-friendly system font stack to reduce mixed font rendering */ -}}
{{- if or .Params.cjkFont site.Params.cjkFont -}}
<style>
  body, button, input, textarea {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC",
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
</style>
{{- end -}}
